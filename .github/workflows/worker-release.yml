name: Release Worker

on:
  push:
    tags:
      - "worker-preview.*"
      - "worker-v*"

permissions:
  contents: read

concurrency:
  group: worker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Worker release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      product_version: ${{ steps.release.outputs.product_version }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit in main."
            exit 1
          fi

      - name: Verify release tag
        id: release
        run: node scripts/worker-release.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify release secrets
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          missing=0
          for name in \
            DOCKERHUB_TOKEN \
            DOCKERHUB_USERNAME \
            RUNPOD_API_KEY \
            VAST_API_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build ${{ matrix.runtime }} Worker
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runtime: [cu128, cu130]
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.2.0

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          df -h /

      - name: Build and push Worker image
        env:
          KASTARD_PRODUCT_VERSION: ${{ needs.prepare.outputs.product_version }}
          KASTARD_SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          WORKER_CHANNEL: ${{ needs.prepare.outputs.channel }}
          WORKER_RUNTIME: ${{ matrix.runtime }}
        run: bash scripts/worker-image.sh "--${WORKER_CHANNEL}" --runtime "$WORKER_RUNTIME" --push

  publish-templates:
    name: Update public Worker templates
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Update RunPod and Vast.ai templates
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          KASTARD_PRODUCT_VERSION: ${{ needs.prepare.outputs.product_version }}
          KASTARD_SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          WORKER_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          bun apps/server/scripts/runpod-worker-templates.ts "--${WORKER_CHANNEL}"
          bun apps/server/scripts/vastai-worker-templates.ts "--${WORKER_CHANNEL}"
